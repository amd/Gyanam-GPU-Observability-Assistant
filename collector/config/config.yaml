# GPU Metrics Collector Configuration

polling:
  # Interval between polling cycles (seconds)
  interval_seconds: 300  # 5 minutes
  # Timeout for individual Redfish HTTP requests (seconds)
  timeout_seconds: 45
  # Maximum concurrent polling operations
  max_concurrent: 100
  # Task polling settings (for async Redfish operations)
  task_poll_interval: 5      # Seconds between task status checks
  task_timeout: 600          # Maximum seconds to wait for task completion
  # Timeout for downloading large attachment files (seconds)
  download_timeout: 600
  # Seconds to wait before retry on polling error
  error_retry_interval: 10

redfish:
  # Default GPU UBB8 diagnostic data collection endpoint
  collect_endpoint: "/redfish/v1/Systems/UBB/LogServices/DiagLogs/Actions/LogService.CollectDiagnosticData"
  # Default request body for collection
  collect_body:
    DiagnosticDataType: "OEM"
    OEMDiagnosticDataType: "AllLogs"
  # Delete completed tasks after successful download (cleanup task history)
  cleanup_task_on_success: true
  # Metric reports to collect via direct GET (tried before task-based fallback).
  # Reports are processed in order: specific reports first claim their metrics,
  # "All" fills only its exclusive metrics (VR/HSC/IBC current & voltage).
  # Set to empty list [] to disable GET-first and always use task-based collection.
  metric_reports:
    - uri: "/redfish/v1/TelemetryService/MetricReports/OAM_ProcessorMetrics_0"
      report_type: processor
    - uri: "/redfish/v1/TelemetryService/MetricReports/OAM_MemoryMetrics_0"
      report_type: memory
    - uri: "/redfish/v1/TelemetryService/MetricReports/OAM_ProcessorPortMetrics_0"
      report_type: interconnect
    - uri: "/redfish/v1/TelemetryService/MetricReports/PlatformSensorsMetrics_0"
      report_type: platform
    - uri: "/redfish/v1/TelemetryService/MetricReports/HealthRollup"
      report_type: health
    - uri: "/redfish/v1/TelemetryService/MetricReports/All"
      report_type: comprehensive

influxdb:
  # InfluxDB connection defaults.
  # These are overridden by INFLUXDB_URL, INFLUXDB_ORG, INFLUXDB_BUCKET
  # environment variables when set (e.g., via docker-compose).
  url: http://influxdb:8086
  org: prometheus
  bucket: gpu_metrics
  # Batch settings for writing metrics.
  # 5000 matches InfluxDB v2's recommended sweet spot. Larger batches
  # increase per-write latency and amplify the cost of any single write
  # timing out.
  batch_size: 5000
  flush_interval_seconds: 10
  # Write timeout in milliseconds (90s for high-scale deployments)
  write_timeout_ms: 90000
  # Maximum concurrent write operations (parallel HTTP writes).
  # Bumped to 10 — at 250+ targets the bottleneck is extraction CPU,
  # not InfluxDB ingestion; more parallelism shortens flush latency.
  max_concurrent_writes: 10
  # Whether to verify SSL certificates when connecting to InfluxDB
  verify_ssl: false

ui:
  # Config UI settings
  port: 8080
  host: "0.0.0.0"
  auth:
    # Default admin credentials (change in production!)
    username: admin
    # bcrypt hash of 'changeme' - CHANGE THIS IN PRODUCTION
    # Generate with: python -c "import bcrypt; print(bcrypt.hashpw(b'yourpassword', bcrypt.gensalt()).decode())"
    password_hash: "$2b$12$DDVvJVK1RdIj//rkWa7g8Op8Sc00hu64FJ9lwMZ/.8hvlXkF7jLaW"

blob:
  # Temporary directory for extracting compressed blobs
  temp_dir: /tmp/telemetry
  # Clean up extracted files after parsing
  cleanup_after_parse: true
  # Maximum blob size to process (bytes) - 100MB default
  max_blob_size: 104857600
  # Maximum age for old file cleanup (seconds) - 1 hour default
  cleanup_max_age_seconds: 3600

collected_logs:
  # Directory for storing collected diagnostic log bundles
  storage_dir: /app/data/collected_logs
  # Number of days to retain collected logs before auto-cleanup
  retention_days: 30
  # Hours between cleanup runs
  cleanup_interval_hours: 6
  # Maximum concurrent log collection operations
  max_concurrent_collections: 5
  # Timeout for task-based log collection (seconds) — longer than metric polling
  task_timeout: 600
  # Timeout for downloading collected log bundles (seconds)
  download_timeout: 600

parser:
  # Maximum recursion depth for JSON traversal in auto-discovery
  max_recursion_depth: 50
  # Number of parallel workers for metric extraction (increase for large fleets)
  max_concurrent_processors: 16

alerts:
  # Enable SSE-based alert subscriptions
  enabled: true
  # Default SSE endpoint for alerts
  sse_endpoint: "/redfish/v1/EventService/SSE"
  # Event types to capture (Alert, StatusChange, ResourceAdded, ResourceRemoved)
  event_types:
    - "Alert"
    - "StatusChange"
  # Severities to capture (Critical, Warning, OK)
  # Note: Add "OK" to enable informational/OK alerts (disabled by default to reduce noise)
  #       UI will automatically show/hide OK alerts based on this configuration
  severities:
    - "Critical"
    - "Warning"
    # OK / informational events are intentionally out of scope for this tool
    # (they are high-volume and not actionable). Only Critical and Warning are
    # collected. Do not add "OK" here without reading docs/SCALABILITY.md.
  # Seconds to wait before reconnecting on SSE connection error (initial delay)
  reconnect_delay: 30
  # Maximum hours to keep retrying failed connections before entering cooldown mode
  # After this duration, subscription enters cooldown period
  max_retry_duration_hours: 2
  # Cooldown period (hours) after max retry duration exceeded
  # After cooldown, one auto-resume attempt is made
  cooldown_duration_hours: 4
  # Hours of continuous failures to consider subscription "degraded" (warning state)
  # This is an intermediate state between "reconnecting" and "on_cooldown"
  degraded_threshold_hours: 0.5
  # Retry permanent webhook failures after this many hours. Set to 0 to disable.
  permanent_failure_retry_hours: 6
  # Number of alerts to batch before writing to database
  batch_size: 100
  # Seconds between batch writes (even if not full)
  batch_interval: 5
  # Maximum alerts in queue (prevents memory overflow with 300+ targets)
  max_queue_size: 50000
  # Days to retain alerts before auto-cleanup
  retention_days: 30
  # Hours between cleanup runs
  cleanup_interval_hours: 6
  # Rate limiting: max alerts per target per minute (prevents alert flooding)
  max_alerts_per_minute: 100
  # Baseline pull: on subscription start, fetch existing Redfish LogService
  # entries so standing/active conditions show up even before a new event fires
  # (SSE/webhook only deliver events emitted after the subscription exists).
  baseline_pull_enabled: true
  # Cap entries fetched per log service (bounds BMC load; dedup makes re-pulls safe)
  baseline_max_entries_per_log: 200
  # Fallback re-pull cadence. SSE/webhook is the primary channel and keeps
  # events current in real time; this periodic pull is only a safety net for
  # events missed during stream outages. Incremental cursors make it cheap.
  # Set to 0 to disable periodic re-pull (start-only).
  baseline_repull_interval_minutes: 60

location:
  # Data-hall placement: rack geometry + how a system's physical location is
  # decoded from its hostname. Placement is also read from the Redfish Chassis
  # Location when the BMC exposes it (that takes precedence over the hostname),
  # and can be set/corrected by hand from the Data Hall view.
  #
  # Rack height in rack units (U) used when rendering a rack. Default models an
  # OCP Open Rack v3 frame (48 OpenU). OCP ORv3 reference: 600 mm external width,
  # ~1200 mm depth, and an "OpenU" (OU) pitch of 48 mm (vs 44.45 mm for a 19"
  # EIA-310 rack unit).
  rack_height_u: 48
  # GPUs per monitored system (GPU UBB = 8 OAMs). Drives the GPU total
  # shown on the Systems page.
  gpus_per_system: 8
  # Default chassis height (rack units) when a system's height isn't encoded.
  # 4U is a conservative single-system footprint; a BMC-reported chassis height
  # or a hostname-encoded height takes precedence when available.
  default_system_height_u: 4
  # Rack-unit standard assumed when a source does not specify one:
  # "OpenU" (OCP Open Rack, 48mm) or "EIA_310" (19" rack, 1.75in / 44.45mm).
  default_unit_type: OpenU
  # Optional full-name regexes with named capture groups
  # (site, hall, row, rack, rack_u, height). Applied to the system NAME (and, as
  # a fallback, the BMC host) after the domain suffix is stripped; tried before
  # token_rules. Use these for positional schemes rather than prefix-tagged ones.
  #
  # Site scheme: the last two tokens are the rack and the trailing numeric slot;
  # everything before them forms the data-hall name. This handles a variable
  # number of leading tokens (cluster / region / site) uniformly. A cluster may
  # span multiple data halls; each distinct hall becomes a selectable hall in the
  # Data Hall View. Add more patterns for other naming formats.
  name_patterns:
    - '^(?P<hall>.+)-(?P<rack>[^-]+)-(?P<rack_u>\d+)$'
  # Ordered (field, single-token regex) rules. The host is split on - _ . and
  # each token is matched; the first rule claiming a still-unset field wins.
  # Unknown tokens are ignored and partial placements are kept. Tailor these to
  # your naming convention; reorder if a prefix means something different at
  # your site (e.g. r<n> here means rack).
  token_rules:
    - {field: hall, pattern: "dh(\\d+)"}
    - {field: hall, pattern: "hall(\\d+)"}
    - {field: row, pattern: "row(\\d+)"}
    - {field: rack, pattern: "rack(\\d+)"}
    - {field: rack, pattern: "r(\\d+)"}
    - {field: rack, pattern: "k(\\d+)"}
    - {field: rack_u, pattern: "ru(\\d+)"}
    - {field: rack_u, pattern: "u(\\d+)"}

inventory:
  # Background enrichment: once per system (and on a staleness interval), read
  # basic inventory + location + chassis height from the BMC via standard
  # Redfish GETs (Chassis/Systems/Managers). Surfaced in the Data Hall tooltip.
  enabled: true
  # How often the enricher loop looks for systems needing inventory (seconds).
  collect_interval_seconds: 300
  # Re-pull a system's inventory once it's older than this many hours.
  # Set to 0 to pull exactly once per system and never refresh.
  refresh_interval_hours: 24
  # Max concurrent BMC inventory fetches.
  max_concurrent: 8
  # Per-request timeout for inventory GETs (seconds).
  request_timeout: 30
  # Skip pre-aggregated statistical MetricReports (Avg/Min/Max over Hour/Day/Week)
  # during discovery — GYANAM downsamples itself, so polling them just adds GETs.
  # Pin one via a per-target metric-report override if you need it.
  discovery_exclude_aggregate_reports: true

sharding:
  # Horizontal sharding across multiple collector processes. The shipped
  # docker-compose enables this (COLLECTOR_SHARDING=true) and runs 3 collector
  # replicas by default — sized for fleets up to ~500 targets (3 x 200 cap).
  # This library-level default stays false so a single standalone collector
  # (run outside compose) owns every target without touching the lease table.
  # Scale the replica count with `docker compose up -d --scale collector=N`;
  # targets rebalance across shards automatically, each capped at
  # max_targets_per_shard.
  enabled: false
  # Assignment strategy (override via COLLECTOR_BALANCE):
  #   dynamic — Rendezvous (HRW) hashing: targets balanced across live collectors
  #     to within +/-1, self-rebalancing with minimal movement as replicas join or
  #     leave. The recommended default; replicas self-assign a stable collector-<n>
  #     id under `--scale` (no COLLECTOR_ID needed).
  #   static  — greedy id-order claiming up to max_targets_per_shard (fills
  #     replicas in turn; one may sit idle). Proven fallback.
  balance: dynamic
  # Max targets one collector will own. In dynamic mode this is a SAFETY CEILING —
  # the real per-pass bound is the fair share ceil(enabled / live_collectors); in
  # static mode it is the claim cap. 200 covers a ~500-target fleet across 3
  # replicas with headroom (3 x 200 = 600).
  max_targets_per_shard: 200
  # Seconds between lease renew/claim passes.
  claim_interval_seconds: 20
  # A lease unheartbeated for this long (owner died) is reclaimable by a peer.
  lease_ttl_seconds: 75
  # Dynamic mode: a collector is "live" (counted in the fair-share denominator) if
  # its stats row is fresher than this. Keep >= 2x claim_interval and <= lease_ttl.
  membership_ttl_seconds: 75

policy:
  # Automated diagnostic-log collection on a fatal/critical event, exposed
  # read-only as a Redfish PolicyService at /redfish/v1/PolicyService.
  enabled: true
  # Disabled | AlertOnly (evaluate + log, don't collect) | Enabled (collect).
  operating_mode: Enabled
  # Per-target hysteresis: minimum seconds between policy-triggered collections
  # for the same target, so an event storm can't drive a tight collection loop.
  # Default 2 hours.
  rearm_seconds: 7200
  # Event severities that fire the policy (case-insensitive).
  trigger_severities:
    - Critical
    - Fatal
  # Optional allow-list of Redfish MessageIds; empty = any at the above severity.
  trigger_message_ids: []

logging:
  level: INFO
  format: "%(asctime)s UTC - %(name)s - %(levelname)s - %(message)s"
