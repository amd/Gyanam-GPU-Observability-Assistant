services:
  # Background data collection service
  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
      args:
        # Set PIP_TRUSTED_HOST=1 in .env to relax PyPI cert checks behind a
        # TLS-intercepting proxy. Empty (default) = full TLS verification.
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    #user: "0:0"  # Run as root
    command: ["python", "-m", "src.collector_main"]
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-prometheus}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-gpu_metrics}
      # Performance tuning for 300+ endpoint scale
      - INFLUXDB_BATCH_SIZE=${INFLUXDB_BATCH_SIZE:-0}  # 0 = use config.yaml default (10000)
      - INFLUXDB_WRITE_TIMEOUT_MS=${INFLUXDB_WRITE_TIMEOUT_MS:-0}  # 0 = use config.yaml default (90000 = 90s)
      - INFLUXDB_MAX_CONCURRENT_WRITES=${INFLUXDB_MAX_CONCURRENT_WRITES:-0}  # 0 = use config.yaml default (5)
      - INFLUXDB_FLUSH_INTERVAL_SECONDS=${INFLUXDB_FLUSH_INTERVAL_SECONDS:-0}  # 0 = use config.yaml default (10s)
      - CONFIG_PATH=/app/config/config.yaml
      - SCHEMA_PATH=/app/config/metrics_schema.yaml
      - DATABASE_URL=sqlite:///data/targets.db
      # Alerts live in PostgreSQL (high-volume time-series). Empty falls back to SQLite.
      - ALERTS_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-gyanam}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gyanam_alerts}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # Alert/Webhook settings (for testing webhook subscriptions)
      - ALERT_WEBHOOK_BASE_URL=${ALERT_WEBHOOK_BASE_URL:-}
      - ALERT_ENABLE_WEBHOOK_FALLBACK=${ALERT_ENABLE_WEBHOOK_FALLBACK:-false}
      - ALERT_FORCE_WEBHOOK_MODE=${ALERT_FORCE_WEBHOOK_MODE:-false}
      # Horizontal sharding. Set COLLECTOR_SHARDING=true and run multiple
      # replicas (`docker compose up -d --scale collector=N`) to distribute
      # targets across collectors. The service has no fixed container_name / host
      # port, so it scales cleanly. In dynamic (HRW) mode each replica self-assigns
      # a STABLE collector-<n> id via a slot claim (COLLECTOR_ID need not be set);
      # set COLLECTOR_ID explicitly only for a pinned id (e.g. k8s StatefulSet).
      - COLLECTOR_SHARDING=${COLLECTOR_SHARDING:-true}
      - MAX_TARGETS_PER_SHARD=${MAX_TARGETS_PER_SHARD:-0}  # 0 = config.yaml default (200)
      # Balancing strategy: "dynamic" (Rendezvous/HRW — even ±1 load, self-
      # rebalancing, the default) or "static" (greedy id-order, fallback). In
      # dynamic mode replicas self-assign a stable collector-<n> id, so COLLECTOR_ID
      # need not be set under `--scale`.
      - COLLECTOR_BALANCE=${COLLECTOR_BALANCE:-dynamic}
    volumes:
      - shared_data:/app/data
      - ./collector/config:/app/config:ro
    depends_on:
      influxdb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # Give the collector time to drain its result queue, release its shard leases,
    # flush the exporter AND delete its webhook subscriptions on SIGTERM. The
    # Docker default grace is only 10s. Webhook teardown is now concurrent, but at
    # fleet scale (plus the ~15s processor drain and the final exporter flush) 30s
    # was still tight — 90s leaves headroom so a restart never SIGKILLs mid-teardown
    # (which would leak BMC subscriptions and lose queued alerts).
    stop_grace_period: 90s
    # Run three collector replicas by default so a fleet up to ~500 targets is
    # sharded across three event loops (COLLECTOR_SHARDING defaults to true, each
    # replica capped at MAX_TARGETS_PER_SHARD=200 -> 3 x 200 = 600 capacity).
    # Small deployments can scale down (`--scale collector=1`); large ones scale
    # up. Honoured natively by Docker Compose v2 `up`.
    deploy:
      replicas: 3
    # Resource limits scaled for 300+ endpoints
    # For smaller deployments (< 50 endpoints), can reduce to mem_limit: 2g, cpus: 2.
    # JSON/JSONPath parsing is GIL-bound and CPU-heavy; under-provisioned CPUs
    # starve the asyncio loop and can stall the flush loop.
    mem_limit: 8g
    cpus: 4
    # Raise the file-descriptor limit well above the per-process default (often
    # 1024). At 300+ endpoints the poller's per-target persistent clients +
    # SSE/alert subscriptions + on-demand log collection can otherwise exhaust
    # the available file descriptors.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - monitoring
    # Note: Port 8081 is only exposed internally for health checks, not to host

  # Web UI and API service
  api:
    build:
      context: ./collector
      dockerfile: Dockerfile
      args:
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    #user: "0:0"  # Run as root
    command: ["python", "-m", "src.api_main"]
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - CONFIG_PATH=/app/config/config.yaml
      - SCHEMA_PATH=/app/config/metrics_schema.yaml
      - DATABASE_URL=sqlite:///data/targets.db
      - ALERTS_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-gyanam}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gyanam_alerts}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - GRAFANA_PORT=${GRAFANA_PORT:-3000}
      - INFLUXDB_PORT=${INFLUXDB_PORT:-8086}
      # Optional UI credentials. Set UI_PASSWORD (and optionally UI_USERNAME) in
      # .env for a real login. GYANAM_ALLOW_DEFAULT_PASSWORD=1 permits the shipped
      # 'changeme' default (dev only; login is otherwise refused).
      - UI_USERNAME=${UI_USERNAME:-}
      - UI_PASSWORD=${UI_PASSWORD:-}
      - GYANAM_ALLOW_DEFAULT_PASSWORD=${GYANAM_ALLOW_DEFAULT_PASSWORD:-}
    volumes:
      - shared_data:/app/data
      - ./collector/config:/app/config:ro
    depends_on:
      - collector
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    mem_limit: 2g
    cpus: 0.5
    # The API also opens short-lived Redfish clients (test-connection, inventory
    # pulls) — raise the FD ceiling for the same reason as the collector.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - monitoring

  influxdb:
    image: influxdb:2.7.11
    #user: "0:0"  # Run as root
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    environment:
      # Onboard a FRESH volume (create the org/bucket/admin user, and set the
      # admin token to INFLUXDB_TOKEN) from the DOCKER_INFLUXDB_INIT_* vars below.
      # Without this a clean install comes up with no org/bucket/token, every
      # collector write 401s, and metrics are silently never stored while /ping
      # still reports healthy. It is a NO-OP on an already-initialized volume
      # (InfluxDB detects the existing setup and skips it), so it is safe to leave
      # enabled across restarts.
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-prometheus}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-gpu_metrics}
      - DOCKER_INFLUXDB_INIT_RETENTION=${INFLUXDB_RETENTION:-7d}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-prometheus}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-gpu_metrics}
      - INFLUXDB_15M_RETENTION=${INFLUXDB_15M_RETENTION:-30d}
      - INFLUXDB_HOURLY_RETENTION=${INFLUXDB_HOURLY_RETENTION:-90d}
      - INFLUXDB_HTTP_BIND_ADDRESS=:8086
      # Performance tuning for high-volume writes (300+ endpoints)
      - INFLUXDB_DATA_CACHE_MAX_MEMORY_SIZE=4294967296  # 4GB cache (increased from 2GB)
      - INFLUXDB_DATA_QUERY_CONCURRENCY=20  # Increased from 10
      - INFLUXDB_HTTP_MAX_ROW_LIMIT=100000
      - INFLUXDB_HTTP_WRITE_TIMEOUT=90s  # Match collector timeout
      - INFLUXDB_STORAGE_WAL_FSYNC_DELAY=100ms  # Batch WAL writes for better performance
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
      # Downsampling-tier setup scripts. Deliberately NOT mounted into
      # /docker-entrypoint-initdb.d: under INIT_MODE=setup the entrypoint would
      # run-parts them during init, but they create tasks via the influx CLI
      # against a server that isn't reachable yet at init time — the script exits
      # non-zero and the entrypoint wipes the fresh volume and retries (broken
      # clean install). Instead they're mounted read-only here and run POST-start
      # on a live server via: ./gyanam.sh setup-all-downsampling
      - ./influxdb/scripts:/influxdb-scripts:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    mem_limit: 16g
    # Sustained ~1.6K writes/s at 250-target scale + Grafana queries + TSM
    # compaction — InfluxDB needs real CPU to keep flush latency below ~3s.
    cpus: 4
    networks:
      - monitoring

  # Alert store — high-volume Redfish alert/event history
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-gyanam}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-gyanam_alerts}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gyanam} -d ${POSTGRES_DB:-gyanam_alerts}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2
    networks:
      - monitoring
    # Not exposed to host by default; reachable on the internal network only.

  grafana:
    image: grafana/grafana:13.0.1
    #user: "0:0"  # Run as root
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-prometheus}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-gpu_metrics}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    mem_limit: 4g
    cpus: 0.5
    networks:
      - monitoring

volumes:
  shared_data:
  influxdb_data:
  influxdb_config:
  grafana_data:
  postgres_data:

networks:
  monitoring:
    driver: bridge
